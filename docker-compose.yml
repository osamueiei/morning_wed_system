services:
  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://cpe:1234@db:5432/mydb
    depends_on:
      - db
  frontend:
    build:
      context: ./client
      dockerfile: public/Dockerfile
    ports:
      - "3333:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cpe
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"

        